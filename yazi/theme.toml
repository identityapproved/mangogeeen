# Tokyo Night (Night) for yazi
[mgr]
cwd = { fg = "#7dcfff" }

hovered         = { fg = "#1a1b26", bg = "#7aa2f7" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#e0af68", italic = true }
find_position = { fg = "#bb9af7", bg = "reset", italic = true }

marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#7dcfff", bg = "#7dcfff" }
marker_selected = { fg = "#7aa2f7", bg = "#7aa2f7" }

tab_active   = { fg = "#1a1b26", bg = "#7aa2f7" }
tab_inactive = { fg = "#c0caf5", bg = "#292e42" }
tab_width    = 1

count_copied   = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut      = { fg = "#1a1b26", bg = "#f7768e" }
count_selected = { fg = "#1a1b26", bg = "#7aa2f7" }

border_symbol = "│"
border_style  = { fg = "#3b4261" }

[mode]
normal_main = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
normal_alt  = { fg = "#7aa2f7", bg = "#292e42" }
select_main = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
select_alt  = { fg = "#9ece6a", bg = "#292e42" }
unset_main  = { fg = "#1a1b26", bg = "#bb9af7", bold = true }
unset_alt   = { fg = "#bb9af7", bg = "#292e42" }

[status]
separator_open  = ""
separator_close = ""

perm_type  = { fg = "#7aa2f7" }
perm_read  = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec  = { fg = "#9ece6a" }
perm_sep   = { fg = "#565f89" }

progress_label  = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#292e42" }
progress_error  = { fg = "#f7768e", bg = "#292e42" }

[which]
mask            = { bg = "#16161e" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#737aa2" }
desc            = { fg = "#c0caf5" }
separator       = "  "
separator_style = { fg = "#3b4261" }

[notify]
title_info  = { fg = "#9ece6a" }
title_warn  = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }

[input]
border   = { fg = "#7aa2f7" }
selected = { reversed = true }

[pick]
border   = { fg = "#7aa2f7" }
active   = { fg = "#bb9af7", bold = true }

[tasks]
border  = { fg = "#7aa2f7" }
hovered = { fg = "#bb9af7", underline = true }

[help]
on      = { fg = "#bb9af7" }
run     = { fg = "#7dcfff" }
hovered = { bg = "#292e42", bold = true }
footer  = { fg = "#292e42", bg = "#c0caf5" }

[filetype]
rules = [
  { mime = "image/*", fg = "#7dcfff" },
  { mime = "{audio,video}/*", fg = "#bb9af7" },
  { mime = "application/{,g}zip", fg = "#e0af68" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#e0af68" },
  { name = "*/", fg = "#7aa2f7" },
  { name = "*", fg = "#c0caf5" },
]
