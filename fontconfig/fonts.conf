<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Default to M+ for the generic families; keep system fonts as
       fallback so glyphs M+ lacks (CJK, emoji) still resolve. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>M+1 Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>M+1 Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>M+1Code Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
